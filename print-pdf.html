<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awesome UI</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="font.css" />
  </head>
  <body>
    <input type="file" id="fileInput" hidden />
    <div class="title">Học tiếng anh cùng bé!</div>
    <div class="rate-container">
      <div>Độ dài:</div>
      <div style="width: 5px"></div>
      <input
        id="maxWidth"
        type="range"
        min="200"
        max="750"
        step="50"
        value="550"
      />
    </div>
    <div class="rate-container">
      <div>Cỡ chữ:</div>
      <div style="width: 5px"></div>
      <input id="fontSize" type="range" min="10" max="20" step="1" value="16" />
    </div>
    <div class="wrapper" id="wrapper">
      <div id="loading"></div>
      <button
        class="upload-btn"
        onclick="document.getElementById('fileInput').click()"
      >
        Tải dữ liệu lên
      </button>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      document.getElementById("maxWidth").onchange = (e) => {
        const value = e.target.value;
        const els = document.getElementsByClassName("container");
        for (const el of els) {
          el.style.maxWidth = `${value}px`;
        }
      };
      document.getElementById("fontSize").onchange = (e) => {
        const value = e.target.value;
        const els = document.getElementsByClassName("content");
        for (const el of els) {
          el.style.fontSize = `${value}px`;
        }
      };
      document.getElementById("fileInput").onchange = async (e) => {
        document.getElementById("loading").classList.add("loading");
        const text = await e.target.files[0].text();
        const questions = text.split("\n");

        const wrapper = document.getElementById("wrapper");
        wrapper.innerHTML = "";

        questions.forEach((line, index) => {
          if (line.trim()) {
            wrapper.appendChild(createItem(line, index));
          }
        });
        document.getElementById("loading").className = "";
        document.getElementById("fileInput").style.display = "none";
      };
      function speak(text) {
        speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = "en-US";
        msg.rate = 1;
        msg.pitch = 1;

        const voices = speechSynthesis.getVoices();
        msg.voice = voices.find((v) => v.lang === "en-US") || voices[0];

        speechSynthesis.speak(msg);
      }

      function createItem(text, index) {
        const container = document.createElement("div");
        container.className = "container";

        container.innerHTML = `
    <div class="order-number">${index}</div>
    <div class="content">${text}</div>
    <div class="suffix">
      <svg width="100%" height="100%" preserveAspectRatio="none">
        <line x1="0%" y1="0%" x2="100%" y2="50%" stroke="black" stroke-width="2"/>
        <line x1="100%" y1="50%" x2="0%" y2="100%" stroke="black" stroke-width="2"/>
      </svg>
    </div>
  `;

        container.querySelector(".order-number").onclick = () => speak(text);

        return container;
      }
    </script>
  </body>
</html>
